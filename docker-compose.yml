services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://yaip:yaip@db:5432/yaip
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env to a random secret, e.g. openssl rand -base64 32}"
      QUITS_AUTH_TRUSTED_PROXIES: ${QUITS_AUTH_TRUSTED_PROXIES:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env to a random secret, e.g. openssl rand -base64 32}"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      QUITS_AI_CUSTOM_ENDPOINT_ENABLED: ${QUITS_AI_CUSTOM_ENDPOINT_ENABLED:-true}
      QUITS_AI_CUSTOM_ENDPOINT_HOSTS: ${QUITS_AI_CUSTOM_ENDPOINT_HOSTS:-}
      QUITS_AI_LOCAL_AGENT_ENABLED: ${QUITS_AI_LOCAL_AGENT_ENABLED:-false}
      QUITS_AI_LOCAL_AGENT_COMMAND: ${QUITS_AI_LOCAL_AGENT_COMMAND:-}
      QUITS_AI_LOCAL_AGENT_TIMEOUT_MS: ${QUITS_AI_LOCAL_AGENT_TIMEOUT_MS:-120000}
      QUITS_AI_LOCAL_AGENT_MAX_CONCURRENT: ${QUITS_AI_LOCAL_AGENT_MAX_CONCURRENT:-2}
    volumes:
      - artifacts:/app/apps/oss/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  # Runs scheduled work (overdue marking, payment reminders, recurring invoices, queued jobs)
  # by calling the app's tick endpoint every five minutes. Every task is idempotent and does a
  # bounded amount of work per tick, so a backlog drains over several ticks. Requests time out
  # so a hung tick never stops later ones; a failed tick is logged and the loop keeps going.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: "${CRON_SECRET:?Set CRON_SECRET in .env to a random secret, e.g. openssl rand -base64 32}"
      TICK_URL: http://app:3000/api/cron/tick
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-300}
      TICK_TIMEOUT_SECONDS: ${TICK_TIMEOUT_SECONDS:-240}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep "$$TICK_INTERVAL_SECONDS"
          curl -fsS --connect-timeout 10 --max-time "$$TICK_TIMEOUT_SECONDS" \
            -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$TICK_URL" \
            || echo "scheduler: tick request failed or timed out"
          echo
        done
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yaip
      POSTGRES_PASSWORD: yaip
      POSTGRES_DB: yaip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaip"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  artifacts:
  pgdata:
