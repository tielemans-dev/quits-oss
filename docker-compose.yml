services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://yaip:yaip@db:5432/yaip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy

  # Runs scheduled work (overdue marking, payment reminders, recurring invoices, queued jobs)
  # by calling the app's tick endpoint every five minutes. Every task is idempotent.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-change-me-in-production}
      TICK_URL: http://app:3000/api/cron/tick
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep "$$TICK_INTERVAL_SECONDS"
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$TICK_URL" || echo "scheduler: tick request failed"
          echo
        done
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yaip
      POSTGRES_PASSWORD: yaip
      POSTGRES_DB: yaip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaip"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
