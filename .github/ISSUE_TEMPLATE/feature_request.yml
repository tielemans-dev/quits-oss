name: Feature request
description: Suggest an improvement to Quits.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Issues here sync to our Linear workspace.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
