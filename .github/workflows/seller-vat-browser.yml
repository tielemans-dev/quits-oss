name: Seller VAT browser evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/seller-vat-browser.yml'
      - 'apps/oss/**'
      - 'packages/contracts/**'
      - 'packages/shared/**'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unique non-PR groups also prevent replacement of pending main/tag runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seller-vat-browser:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Seller VAT browser (${{ matrix.revision }}, ${{ matrix.distribution }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: baseline
            distribution: selfhost
          - revision: after
            distribution: selfhost
          - revision: after
            distribution: cloud
    services:
      postgres:
        # MOCK: disposable test database only. Same pinned Official Image as CI.
        image: mirror.gcr.io/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qui62_oss_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qui62_oss_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qui62_oss_browser?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:3040
      BETTER_AUTH_SECRET: qui62-browser-test-secret-over-32-characters
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3040
      QUITS_APP_ORIGIN: http://127.0.0.1:3040
      QUITS_DISTRIBUTION: ${{ matrix.distribution }}
      VITE_QUITS_DISTRIBUTION: ${{ matrix.distribution }}
      QUITS_PUBLIC_PAYMENT_SECRET: qui62-browser-payment-test-secret
      RESEND_API_KEY: ''
      EMAIL_PROVIDER: ''
      SMTP_HOST: ''
      QUI62_HOSTED_FIXTURE: ${{ matrix.distribution == 'cloud' && 'true' || 'false' }}
      QUI62_EVIDENCE_REVISION: ${{ matrix.revision }}
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Production TSX imported by the Node worker must create actual React elements.
      PW_TEST_SOURCE_TRANSFORM: ${{ github.workspace }}/apps/oss/tests/e2e/react-jsx-transform.cjs
      PW_TEST_SOURCE_TRANSFORM_SCOPE: ${{ github.workspace }}/apps/oss/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'main' || github.event.pull_request.head.sha || github.sha }}
      - name: Install the test-only baseline harness from the PR
        if: matrix.revision == 'baseline'
        run: |
          git fetch origin "$EVIDENCE_SHA"
          git show "$EVIDENCE_SHA:apps/oss/playwright.seller-vat.config.ts" > apps/oss/playwright.seller-vat.config.ts
          git show "$EVIDENCE_SHA:apps/oss/tests/e2e/seller-vat-evidence.ts" > apps/oss/tests/e2e/seller-vat-evidence.ts
          git show "$EVIDENCE_SHA:apps/oss/tests/e2e/seller-vat-baseline.spec.ts" > apps/oss/tests/e2e/seller-vat-baseline.spec.ts
          git show "$EVIDENCE_SHA:apps/oss/tests/e2e/react-jsx-transform.cjs" > apps/oss/tests/e2e/react-jsx-transform.cjs
      - name: Record source revisions
        run: |
          git rev-parse HEAD > source-revision.txt
          echo "$EVIDENCE_SHA" > harness-revision.txt
          if [ "$QUI62_EVIDENCE_REVISION" = baseline ]; then
            echo "Current-main baseline, including merged seller VAT UI and issuance guards. Synthetic non-registered seller seeded explicitly. Not historical pre-feature evidence or proof of VAT choice through the UI." > evidence-scope.txt
          else
            echo "PR-head feature verification. Synthetic fixtures only; cloud captures use a test runtime extension." > evidence-scope.txt
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --filter @quits/oss prisma:generate
      - name: Install Chromium
        working-directory: apps/oss
        run: bunx playwright install --with-deps chromium
      - name: Install PDF rasterizer for exported PDF evidence
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify feature and capture screenshots
        working-directory: apps/oss
        run: bunx playwright test -c playwright.seller-vat.config.ts
      - name: Upload screenshots, traces and source revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-vat-${{ matrix.revision }}-${{ matrix.distribution }}
          path: |
            apps/oss/test-results
            apps/oss/playwright-report/seller-vat
            source-revision.txt
            harness-revision.txt
            evidence-scope.txt
          retention-days: 14
