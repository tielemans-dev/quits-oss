name: QUI-137 editor evidence

on:
  pull_request:
    paths:
      - .github/workflows/qui137-evidence.yml
      - apps/oss/src/routes/_app/invoices/$invoiceId.tsx
      - apps/oss/tests/e2e/invoice-delivery-date-qui137.spec.ts

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'fix/qui-137-draft-delivery-date'
    name: Draft editor screenshots (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qui137
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qui137"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qui137
      QUI137_SCREENSHOT_STAGE: ${{ matrix.phase }}
      QUI137_CAPTURE_DIR: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.phase == 'before' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - name: Use the same test harness for both revisions
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git show "$HEAD_SHA:apps/oss/tests/e2e/invoice-delivery-date-qui137.spec.ts" > apps/oss/tests/e2e/invoice-delivery-date-qui137.spec.ts
          mkdir -p evidence
          git rev-parse HEAD > evidence/application-sha.txt
          echo "$HEAD_SHA" > evidence/harness-sha.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - working-directory: apps/oss
        run: bunx playwright install --with-deps chromium
      - working-directory: apps/oss
        run: bunx playwright test invoice-delivery-date-qui137.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qui137-${{ matrix.phase }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
