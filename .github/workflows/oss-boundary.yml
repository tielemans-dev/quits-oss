name: OSS Boundary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

concurrency:
  # Preserve every main run, including pending runs; supersede the same non-main ref.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  paths:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-expensive: ${{ steps.classify.outputs.run-expensive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate required-check failure propagation
        run: node --test .github/scripts/ci-gate.test.mjs
      - name: Classify documentation-only PRs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_expensive=true
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            # An empty or unreadable diff must not bypass verification.
            if [ -s "$RUNNER_TEMP/changed-paths" ]; then
              run_expensive=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  COPY.md|docs/*.md|docs/*.mdx) ;;
                  *) run_expensive=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "run-expensive=$run_expensive" >> "$GITHUB_OUTPUT"

  boundary-worker:
    name: OSS boundary execution
    needs: paths
    # Run on classification failure unless cancelled; only successful docs-only results may skip.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (needs.paths.result != 'success' || needs.paths.outputs.run-expensive != 'false')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image mirror; provenance/update procedure: docs/qa/ci-postgres-image.md
        image: mirror.gcr.io/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yaip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaip?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-example-secret-that-is-over-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install boundary search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tracked client may predate schema changes in this PR.
      - name: Generate Prisma client
        run: bun --filter @quits/oss prisma:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        working-directory: apps/oss
        run: bunx prisma migrate deploy

      - name: Run OSS boundary checks
        run: |
          bash scripts/__tests__/oss-boundaries.test.sh
          bash scripts/check-oss-boundaries.sh

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  verify-oss-boundary:
    name: verify-oss-boundary
    needs: [paths, boundary-worker]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful work or confirmed documentation-only PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
