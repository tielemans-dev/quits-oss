name: OSS Boundary

on:
  push:
  pull_request:

jobs:
  verify-oss-boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image mirror; provenance/update procedure: docs/qa/ci-postgres-image.md
        image: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yaip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaip?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-example-secret-that-is-over-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install boundary search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Generate Prisma client
        run: bun --filter @quits/oss prisma:generate

      - name: Apply migrations
        working-directory: apps/oss
        run: bunx prisma migrate deploy

      - name: Run OSS boundary checks
        run: |
          bash scripts/__tests__/oss-boundaries.test.sh
          bash scripts/check-oss-boundaries.sh

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
