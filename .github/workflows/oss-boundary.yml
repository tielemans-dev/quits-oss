name: OSS Boundary

on:
  push:
  pull_request:

concurrency:
  # Unique non-PR groups also prevent replacement of pending push/tag runs.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') }}

jobs:
  paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-expensive: ${{ steps.classify.outputs.run-expensive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify documentation-only PRs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_expensive=true
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            # An empty or unreadable diff must not bypass verification.
            if [ -s "$RUNNER_TEMP/changed-paths" ]; then
              run_expensive=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|COPY.md|CONTRIBUTING.md|docs/*.md|docs/*.mdx) ;;
                  *) run_expensive=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "run-expensive=$run_expensive" >> "$GITHUB_OUTPUT"

  verify-oss-boundary:
    needs: paths
    # Run on classification failure; only a successful docs-only result may skip.
    if: always() && (needs.paths.result != 'success' || needs.paths.outputs.run-expensive != 'false')
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image mirror; provenance/update procedure: docs/qa/ci-postgres-image.md
        image: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yaip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaip?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-example-secret-that-is-over-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install boundary search tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Generate Prisma client
        run: bun --filter @quits/oss prisma:generate

      - name: Apply migrations
        working-directory: apps/oss
        run: bunx prisma migrate deploy

      - name: Run OSS boundary checks
        run: |
          bash scripts/__tests__/oss-boundaries.test.sh
          bash scripts/check-oss-boundaries.sh

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
