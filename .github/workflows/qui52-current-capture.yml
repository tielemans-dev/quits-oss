name: QUI-52 current-head evidence

on:
  push:
    branches: [fix/qui-52-email-payment-block]
    paths:
      - .github/workflows/qui52-current-capture.yml
      - apps/oss/e2e/qui52-current-capture.mjs
      - apps/oss/tests/shared/invoice-payment-capture.spec.ts
      - apps/oss/tests/shared/invoice-payment-block.spec.ts
      - apps/oss/src/lib/email.ts
      - apps/oss/src/lib/__tests__/invoice-email-payment.test.ts
      - apps/oss/src/lib/documents/invoice-payment-rows.ts
      - apps/oss/src/lib/payment-details-block.ts
      - apps/oss/src/components/invoices/invoice-payment-instructions.tsx
      - apps/oss/src/domain/documents/invoice-email.ts
      - apps/oss/src/domain/documents/issued-invoice.ts
      - apps/oss/src/domain/documents/issued-settlement.ts
      - apps/oss/src/domain/documents/settlement.ts
      - apps/oss/src/trpc/routers/invoices.ts
      - apps/oss/src/routes/_app/invoices/$invoiceId.tsx

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # MOCK: dedicated synthetic email sink. No external email provider.
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/oss
        run: bunx playwright install --with-deps chromium
      - name: Prepare disposable PostgreSQL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          POSTGRES_IMAGE: ghcr.io/tielemans-dev/ci-postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        run: |
          auth_dir=$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$auth_dir" login ghcr.io --username "$GHCR_USER" --password-stdin
          docker --config "$auth_dir" pull "$POSTGRES_IMAGE"
          docker tag "$POSTGRES_IMAGE" postgres:16-alpine
      - name: Capture current-head UI with MOCK data, one worker
        working-directory: apps/oss
        run: |
          mkdir -p "$PWD/test-results/tmp"
          TMPDIR="$PWD/test-results/tmp" node e2e/qui52-current-capture.mjs
      - name: Record provenance and image hashes
        env:
          CAPTURE_HEAD: ${{ github.sha }}
          CAPTURE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          root = Path('apps/oss/test-results/qui52-current')
          images = []
          for p in sorted(root.glob('*/*.png')):
              data = p.read_bytes()
              width, height = struct.unpack('>II', data[16:24])
              images.append(dict(path=str(p.relative_to(root)), width=width, height=height, sha256=hashlib.sha256(data).hexdigest()))
          assert len(images) == 16, images
          manifest = dict(issue='QUI-52', source='Current PR head; issued invoice and delivered DA/EN payment emails after live seller and payment settings changes; exact inline fallback asserted', codeHead=os.environ['CAPTURE_HEAD'], ciRun=os.environ['CAPTURE_RUN'], fullPage=True, viewports=dict(desktop=dict(width=1440,height=1000),mobile=dict(width=390,height=844)), mocks=['Synthetic issued seller/customer/invoice/bank details and changed live settings', 'Test-only PDF/artifact adapters', 'Disposable PostgreSQL and SMTP Mailpit'], screenshots=images)
          (root / 'current-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload current-head screenshots, provenance and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qui52-current-${{ github.sha }}
          path: |
            apps/oss/test-results/qui52-current
            apps/oss/test-results/shared-logs
            apps/oss/test-results/shared
            apps/oss/playwright-report/shared
          retention-days: 30
