name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        # Docker Official Image mirror; provenance/update procedure: docs/qa/ci-postgres-image.md
        image: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yaip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaip?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-example-secret-that-is-over-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Generate Prisma client
        run: bun --filter @quits/oss prisma:generate

      - name: Apply migrations
        working-directory: apps/oss
        run: bunx prisma migrate deploy

      - name: Validate Prisma schema
        working-directory: apps/oss
        run: bunx prisma validate

      - name: Verify migration status
        working-directory: apps/oss
        run: bunx prisma migrate status

      - name: Run unit and router tests
        run: bun run test

      - name: Run integration smoke tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        working-directory: apps/oss
        run: bunx playwright install --with-deps chromium

      - name: Verify onboarding review choices and draft persistence
        working-directory: apps/oss
        run: bunx playwright test --config playwright.onboarding-v2.config.ts --workers=1

      - name: Run browser smoke tests
        run: bun run test:e2e

      - name: Verify credit note email and PDF with Mailpit
        env:
          EMAIL_PROVIDER: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_REQUIRE_TLS: "false"
          FROM_EMAIL: billing@example.test
          MAILPIT_URL: http://127.0.0.1:8025
        run: bun run test:e2e credit-note-detail.spec.ts --workers=1

      - name: Capture QUI-64 before and after screenshots
        env:
          EMAIL_PROVIDER: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_REQUIRE_TLS: "false"
          FROM_EMAIL: billing@example.test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="${BASE_SHA:-$(git merge-base HEAD origin/main)}"
          files=(
            'apps/oss/src/components/quotes/public-quote-page.tsx'
            'apps/oss/src/components/credit-notes/credit-notes-table.tsx'
            'apps/oss/src/routes/_app/credit-notes/$creditNoteId.tsx'
          )
          restore_sources() { git restore --source=HEAD -- "${files[@]}"; }
          trap restore_sources EXIT
          for file in "${files[@]}"; do git show "$baseline:$file" > "$file"; done
          QUI64_SCREENSHOT_STAGE=before bun run test:e2e qui64-screenshots.spec.ts --workers=1
          restore_sources
          QUI64_SCREENSHOT_STAGE=after bun run test:e2e qui64-screenshots.spec.ts --workers=1

      - name: Upload QUI-64 screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qui64-browser-evidence
          path: |
            .github/assets/qui64/
            apps/oss/test-results/
            apps/oss/playwright-report/

      - name: Upload browser smoke reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results
          path: |
            apps/oss/playwright-report/
            apps/oss/test-results/
          retention-days: 7

      - name: Verify packed package artifact
        run: node scripts/check-packed-build.mjs

  shared-browser:
    name: Shared product browser scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/oss
        run: bunx playwright install --with-deps chromium
      # The shared harness runs postgres:16-alpine with the default missing-image pull policy.
      # Seed its local tag from the same pinned Official Image used by CI services.
      - name: Prepare PostgreSQL for the shared browser harness
        env:
          POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        run: |
          docker pull "$POSTGRES_IMAGE"
          docker tag "$POSTGRES_IMAGE" postgres:16-alpine
          test "$(docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE")" = "$(docker image inspect --format '{{.Id}}' postgres:16-alpine)"
          test "$(docker run --rm --pull=never postgres:16-alpine postgres --version)" = 'postgres (PostgreSQL) 16.15'
      - name: Test the built app with disposable PostgreSQL
        run: bun run test:e2e:shared
      - name: Upload browser reports and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-browser-results
          path: |
            apps/oss/playwright-report/shared
            apps/oss/test-results
          retention-days: 7

  quote-evidence:
    name: Quote evidence (${{ matrix.phase }})
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 130
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qui65
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qui65"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qui65?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-example-secret-that-is-over-32-characters
      QUI65_EVIDENCE: 'true'
      QUI65_SCREENSHOTS: ${{ matrix.phase }}
      QUI65_CAPTURE_DIR: ${{ github.workspace }}/evidence/${{ matrix.phase }}
    steps:
      - name: Checkout exact PR head and capture harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: Checkout main baseline
        if: matrix.phase == 'before'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: head/.bun-version
      - name: Select application and record provenance
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          if [ "$PHASE" = before ]; then
            app=baseline
            # Copy only test harness files. Baseline production sources stay at main.
            cp head/apps/oss/tests/e2e/quote-polish-qui65.spec.ts baseline/apps/oss/tests/e2e/
            cp head/apps/oss/tests/e2e/support.ts baseline/apps/oss/tests/e2e/support.ts
            cp head/apps/oss/playwright.config.ts baseline/apps/oss/playwright.config.ts
            git -C baseline diff --exit-code -- apps/oss/src packages
          else
            app=head
          fi
          echo "QUI65_APP=$app" >> "$GITHUB_ENV"
          mkdir -p "$QUI65_CAPTURE_DIR" "$GITHUB_WORKSPACE/$app/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/$app/.tmp" >> "$GITHUB_ENV"
          node -e 'const fs=require("node:fs"),cp=require("node:child_process"); const sha=p=>cp.execFileSync("git",["-C",p,"rev-parse","HEAD"],{encoding:"utf8"}).trim(); fs.writeFileSync(process.env.QUI65_CAPTURE_DIR+"/provenance.json",JSON.stringify({phase:process.env.PHASE,applicationSha:sha(process.argv[1]),harnessSha:sha("head"),baseline:"PR base commit on main; only test harness copied",mock:"Synthetic documents/customers/events in disposable localhost qui65 database",run:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID},null,2))' "$app"
      - name: Install application dependencies
        run: cd "$QUI65_APP" && bun install --frozen-lockfile
      - name: Install pinned browser in CI
        run: cd "$QUI65_APP/apps/oss" && bunx playwright install --with-deps chromium
      - name: Capture real application matrix with one worker
        run: cd "$QUI65_APP/apps/oss" && bunx playwright test quote-polish-qui65.spec.ts --workers=1
      - name: Check complete matrix and archive
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          node head/scripts/check-qui65-evidence.mjs "$QUI65_CAPTURE_DIR" "$PHASE"
          tar -czf "evidence/qui65-$PHASE.tar.gz" -C evidence "$PHASE"
      - name: Upload quote evidence and browser diagnostics
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qui65-${{ matrix.phase }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            evidence/
            baseline/apps/oss/playwright-report/
            baseline/apps/oss/test-results/
            head/apps/oss/playwright-report/
            head/apps/oss/test-results/
          retention-days: 30
      - name: Link evidence for visual review
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PHASE: ${{ matrix.phase }}
        run: |
          echo "QUI-65 $PHASE evidence: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "A green capture job certifies the manifest has all 56 screenshots and 16 locale files. A failed job may contain partial diagnostics only. Ines visual sign-off remains separate." >> "$GITHUB_STEP_SUMMARY"

  onboarding-pr121-evidence:
    name: PR 121 onboarding evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 121
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onb121
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onb121"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onb121?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-onboarding-example-secret-over-32-characters
      PLAYWRIGHT_QUITS_DISTRIBUTION: cloud
      QUITS_DISTRIBUTION: cloud
      QUITS_BILLING_ENABLED: "false"
      SIGNUP_MODE: open
      ONB121_HEAD: ${{ github.event.pull_request.head.sha }}
      ONB121_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record exact source and capture directory
        run: |
          test "$(git rev-parse HEAD)" = "$ONB121_HEAD"
          echo "ONB121_CAPTURE_DIR=$GITHUB_WORKSPACE/evidence/onb-121" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Generate client for test fixture
        working-directory: apps/oss
        run: bunx prisma generate
      - name: Install pinned Chromium
        working-directory: apps/oss
        run: bunx playwright install --with-deps chromium
      - name: Capture actual onboarding in Danish and English with one worker
        working-directory: apps/oss
        run: bunx playwright test onboarding-pr121.spec.ts --workers=1
      - name: Validate screenshot matrix and PNG dimensions
        run: node scripts/check-onboarding-pr121-evidence.mjs "$ONB121_CAPTURE_DIR"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: onb-121-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            evidence/onb-121/
            apps/oss/playwright-report/
            apps/oss/test-results/
          retention-days: 30
      - name: Link capture artifact
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo "PR 121 onboarding evidence: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Only a green capture job certifies all eight screenshots. Synthetic authenticated account, disposable CI database, actual application at $ONB121_HEAD. Human visual review remains separate." >> "$GITHUB_STEP_SUMMARY"
